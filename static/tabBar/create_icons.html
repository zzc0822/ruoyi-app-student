<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<canvas id="c1" width="81" height="81"></canvas>
<canvas id="c2" width="81" height="81"></canvas>
<canvas id="c3" width="81" height="81"></canvas>
<canvas id="c4" width="81" height="81"></canvas>
<script>
function drawHome(canvas, color) {
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(40, 10);
  ctx.lineTo(10, 40);
  ctx.lineTo(20, 40);
  ctx.lineTo(20, 70);
  ctx.lineTo(60, 70);
  ctx.lineTo(60, 40);
  ctx.lineTo(70, 40);
  ctx.closePath();
  ctx.fill();
}
function drawMe(canvas, color) {
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(40, 30, 15, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(40, 65, 25, Math.PI, 0, true);
  ctx.fill();
}
drawHome(document.getElementById('c1'), '#999999');
drawHome(document.getElementById('c2'), '#667eea');
drawMe(document.getElementById('c3'), '#999999');
drawMe(document.getElementById('c4'), '#667eea');
setTimeout(() => {
  [
    ['c1', 'home.png'],
    ['c2', 'home-active.png'],
    ['c3', 'me.png'],
    ['c4', 'me-active.png']
  ].forEach(([id, name]) => {
    const a = document.createElement('a');
    a.download = name;
    a.href = document.getElementById(id).toDataURL('image/png');
    a.click();
  });
}, 100);
</script>
</body>
</html>
